<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisedo SKU Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #4A3FB5; --brand-soft: #E9E8F6; --brand-hover: #3D339A; --brand-pressed: #312980;
    --good: #0B6E55; --good-soft: #E3F3EE; --bad: #B42318; --bad-soft: #FDECEA; --warn: #8A5A00; --warn-soft: #FFF4DB;
    --text: #1B1B2F; --muted: #5E6178; --line: #E4E4EE; --bg: #F6F6FB; --card: #FFFFFF;
    --shadow: 0 8px 24px rgba(74, 90, 138, 0.08); --radius: 16px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 'Readex Pro', system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
  .logo { display: flex; align-items: center; gap: 2px; font-weight: 600; font-size: 18px; direction: ltr; text-decoration: none; color: var(--text); }
  .logo svg { width: 18px; height: 18px; }
  .tag { font-size: 12px; color: var(--muted); padding: 2px 8px; border-radius: 99px; background: var(--brand-soft); }
  .spacer { flex: 1; }
  .btn { border: 0; border-radius: 12px; padding: 9px 14px; background: var(--brand); color: #fff; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--brand-hover); } .btn:active { background: var(--brand-pressed); }
  .btn.soft { background: var(--brand-soft); color: var(--brand); } .btn.soft:hover { background: #DCDAF1; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.danger { background: var(--bad-soft); color: var(--bad); }
  .btn.small { padding: 5px 10px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .auth { display: flex; gap: 6px; align-items: center; }
  .auth input { width: 200px; }
  input[type=text], input[type=number], input[type=password], input[type=url], input[type=search], select, textarea {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; min-width: 0; width: 100%;
  }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  main { padding: 20px 0 60px; }
  .intro { margin: 0 0 14px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .tab { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected=true] { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tab .n { opacity: .7; font-size: 12px; margin-left: 4px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  .toolbar input[type=search] { max-width: 280px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: #FAFAFE; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pname { font-weight: 500; } .sub { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
  .pill.good { background: var(--good-soft); color: var(--good); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(27, 27, 47, .35); z-index: 10; display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 11; overflow-y: auto; transform: translateX(100%); transition: transform .2s; }
  .open .scrim { display: block; } .open .drawer { transform: none; }
  .dhead { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: center; z-index: 2; }
  .dhead h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dbody { padding: 16px; display: grid; gap: 16px; }
  .section { padding: 16px; }
  .section h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f .u { color: var(--muted); font-size: 11px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); }
  .offer { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; display: grid; gap: 10px; }
  .offer + .offer { margin-top: 10px; }
  .offer .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .offer.dirty { border-color: var(--brand); }
  .errors { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .errors ul { margin: 4px 0 0; padding-left: 18px; }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 20; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
  .toast.bad { background: var(--bad); }
  dialog { border: 0; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; width: min(560px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(27, 27, 47, .35); }
  dialog h3 { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  @media (max-width: 640px) {
    .auth input { width: 140px; }
    .hide-sm { display: none; }
    th, td { padding: 9px 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="./" aria-label="Wisedo try-out">Wised<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="24" fill="none" stroke="#4A3FB5" stroke-width="10"/><circle cx="32" cy="32" r="9" fill="#4A3FB5"/></svg></a>
    <span class="tag" id="tenant">SKU catalog</span>
    <span class="spacer"></span>
    <a href="./" class="btn soft small">Try the engine</a>
    <form class="auth" id="auth"></form>
  </div>
</header>
<main class="wrap">
  <p class="intro">This tenant's own catalog, B2B style. The engine recommends only from these SKUs, so any change here shows up in the try-out after a reload. All rows are sample data; prices are not real.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name, brand or id" aria-label="Search">
    <span class="spacer"></span>
    <button class="btn small" id="add" data-admin>Add SKU</button>
    <a class="btn soft small" id="export">Export CSV</a>
    <button class="btn soft small" id="importBtn" data-admin>Import CSV</button>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
    <button class="btn ghost small" id="reset" data-admin>Reset to sample data</button>
  </div>
  <div class="card tablewrap"><table>
    <thead><tr><th>SKU</th><th class="hide-sm">Key specs</th><th class="num hide-sm">Ref price</th><th class="num">Lowest offer</th><th class="num">Offers</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
  </table></div>
</main>
<div id="drawerRoot">
  <div class="scrim" data-close></div>
  <aside class="drawer" aria-label="SKU editor" id="drawer"></aside>
</div>
<dialog id="dlg"></dialog>
<script type="module" src="./skus.js"></script>
</body>
</html>
